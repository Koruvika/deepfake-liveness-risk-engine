[project]
name = "fdemo"
version = "0.1.0"
description = "CPU-only multi-layer deepfake / spoof / injection risk engine demo"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python-headless>=4.10",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "mediapipe>=0.10.14",
  "uniface>=4.0",
  "torch>=2.3",
  "efficientnet-pytorch>=0.7.1",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "typer>=0.12",
  "remotezip>=0.12",
  "gdown>=5.2",
  "huggingface-hub>=0.24",
  "tqdm>=4.66",
  "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fdemo = "fdemo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdemo"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded model weights in models/",
  "data: needs prepared RAVDESS clips in data/",
]
